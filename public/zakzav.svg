<svg width="220" height="220" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Strong glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- X-ray gradient -->
    <linearGradient id="xray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <!-- Scan line -->
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="220" height="220" rx="28" fill="#020617"/>

  <!-- BIG Z (lebih bold) -->
  <path
    d="M50 55 H170 L65 165 H170"
    stroke="url(#xray)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- BONE (lebih realistis & bold) -->
  <g filter="url(#glow)">
    <!-- bone head kiri -->
    <circle cx="85" cy="85" r="12" fill="#e0f2fe"/>
    <circle cx="75" cy="75" r="6" fill="#bae6fd"/>

    <!-- bone head kanan -->
    <circle cx="135" cy="135" r="12" fill="#e0f2fe"/>
    <circle cx="145" cy="145" r="6" fill="#bae6fd"/>

    <!-- shaft tulang -->
    <rect
      x="82"
      y="90"
      width="56"
      height="10"
      rx="5"
      transform="rotate(45 82 90)"
      fill="url(#xray)"
    />

    <!-- highlight dalam (efek X-ray dalam tulang) -->
    <line
      x1="90"
      y1="90"
      x2="130"
      y2="130"
      stroke="#e0f2fe"
      stroke-width="2"
      opacity="0.7"
    />
  </g>

  <!-- SCAN EFFECT -->
  <rect x="0" y="0" width="220" height="220" fill="url(#scan)" opacity="0.4"/>

  <!-- TEXT -->
  <text
    x="110"
    y="195"
    text-anchor="middle"
    fill="#7dd3fc"
    font-size="20"
    font-weight="bold"
    font-family="Arial, sans-serif"
    letter-spacing="3"
  >
    ZAKZAV
  </text>
</svg>